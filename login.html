<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | Yake Power Systems</title>
    <link rel="stylesheet" href="css/estilos.css" />
    <style>
        /* centrar el formulario y alertas */
        .login-container {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f9f9f9;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1.5px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #333333;
            box-shadow: 0 0 0 3px rgba(51, 51, 51, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #555;
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .error-message {
            color: #d9534f;
            background-color: #f2dede;
            border: 1px solid #ebccd1;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-weight: bold;
            display: none;
        }

        .success-message {
            color: #3c763d;
            background-color: #dff0d8;
            border: 1px solid #d6e9c6;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-weight: bold;
            display: none;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 30px 15px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Yake Power Systems</h1>
        <p>Acceso al Sistema de Gestión de Conduces</p>
    </header>

    <main>
        <div class="login-container">
            <h2>Iniciar Sesión</h2>

            <div id="error-alert" class="error-message"></div>
            <div id="success-alert" class="success-message"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="identifier">Usuario o Correo Electrónico:</label>
                    <input type="text" id="identifier" placeholder="ejemplo@yake.com o admin" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar al Sistema</button>
            </form>
        </div>
    </main>

    <footer>
        <p>Proyecto académico - Desarrollo de Aplicaciones Web ISW-306</p>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
